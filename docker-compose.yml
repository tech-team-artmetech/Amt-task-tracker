version: '3.8'

services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=production
      - PORT=3000
      - GEMINI_API_KEY=${GEMINI_API_KEY}
      - JWT_SECRET=${JWT_SECRET:-production_whiteboard_secret_replace_in_prod}
      - SQL_HOST=postgres
      - SQL_DB_NAME=whiteboard
      - SQL_USER=whiteboard_user
      - SQL_PASSWORD=whiteboard_password
      - SQL_ADMIN_USER=whiteboard_user
      - SQL_ADMIN_PASSWORD=whiteboard_password
    depends_on:
      postgres:
        condition: service_healthy

  postgres:
    image: postgres:16-alpine
    restart: always
    environment:
      POSTGRES_DB: whiteboard
      POSTGRES_USER: whiteboard_user
      POSTGRES_PASSWORD: whiteboard_password
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U whiteboard_user -d whiteboard"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  pgdata:
